spec_version: "0.1.0"
name: distributed-raft-log-compactor
version: 1.0.0
description: Dynamically coordinates Raft consensus log snapshotting, leader lease extensions, and WAL compaction across high-throughput distributed stores.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - raft-log-snapshot-coordination
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/distributed-raft-log-compactor"
